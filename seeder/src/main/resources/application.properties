# Seeder orchestrator — minimal Quarkus app
quarkus.application.name=seeder

# Disable HTTP server (one-shot runner)
quarkus.http.port=-1

# Disable extensions not needed by seeder
quarkus.hibernate-orm.enabled=false
quarkus.scheduler.enabled=false

# Exclude ALL non-seeder CDI beans — seeder uses ServiceLoader, not CDI
quarkus.arc.exclude-patterns=\
  com.sanedge.common.cache.**,\
  com.sanedge.common.chaos.**,\
  com.sanedge.common.observability.**,\
  com.sanedge.common.exception.**,\
  com.sanedge.common.jwt.**,\
  com.sanedge.common.config.**,\
  com.sanedge.common.health.**,\
  com.sanedge.user.service.**,\
  com.sanedge.user.handler.**,\
  com.sanedge.user.repository.**,\
  com.sanedge.role.service.**,\
  com.sanedge.role.handler.**,\
  com.sanedge.role.repository.**,\
  com.sanedge.auth.service.**,\
  com.sanedge.auth.handler.**,\
  com.sanedge.auth.repository.**,\
  com.sanedge.category.service.**,\
  com.sanedge.category.handler.**,\
  com.sanedge.category.repository.**,\
  com.sanedge.merchant.service.**,\
  com.sanedge.merchant.handler.**,\
  com.sanedge.merchant.repository.**,\
  com.sanedge.merchant_award.service.**,\
  com.sanedge.merchant_award.handler.**,\
  com.sanedge.merchant_business.service.**,\
  com.sanedge.merchant_business.handler.**,\
  com.sanedge.merchant_detail.service.**,\
  com.sanedge.merchant_detail.handler.**,\
  com.sanedge.merchant_policy.service.**,\
  com.sanedge.merchant_policy.handler.**,\
  com.sanedge.product.service.**,\
  com.sanedge.product.handler.**,\
  com.sanedge.product.repository.**,\
  com.sanedge.order.service.**,\
  com.sanedge.order.handler.**,\
  com.sanedge.order.repository.**,\
  com.sanedge.order_item.service.**,\
  com.sanedge.order_item.handler.**,\
  com.sanedge.order_item.repository.**,\
  com.sanedge.cart.service.**,\
  com.sanedge.cart.handler.**,\
  com.sanedge.cart.repository.**,\
  com.sanedge.transaction.service.**,\
  com.sanedge.transaction.handler.**,\
  com.sanedge.transaction.repository.**,\
  com.sanedge.review.service.**,\
  com.sanedge.review.handler.**,\
  com.sanedge.review.repository.**,\
  com.sanedge.review_detail.service.**,\
  com.sanedge.review_detail.handler.**,\
  com.sanedge.banner.service.**,\
