apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-stats-topics
  namespace: ecommerce
spec:
  # Limited retries: topic creation is idempotent (--if-not-exists), so a few
  # attempts against a not-yet-ready broker is enough before giving up.
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-init
          # Pin to the same image as the broker (apache/kafka:3.7.0) so the
          # embedded kafka-topics.sh matches the cluster and the tag actually
          # exists in the registry.
          image: apache/kafka:3.7.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Creating stats Kafka topics..."
              for topic in \
                stats.ecommerce.transaction.event \
                stats.ecommerce.order.event \
                stats.ecommerce.order_item.event; do
                kafka-topics.sh \
                  --bootstrap-server kafka.ecommerce.svc.cluster.local:9092 \
                  --create \
                  --if-not-exists \
                  --replication-factor 1 \
                  --partitions 1 \
                  --topic "$topic"
              done
              echo "All stats topics created (or already exist)."
