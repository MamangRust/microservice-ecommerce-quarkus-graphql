quarkus.application.name=banner-service

quarkus.grpc.server.port=9013
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8093
quarkus.http.host=0.0.0.0

# JDBC URL required by Flyway
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:DRAGON}
quarkus.datasource.password=${DB_PASSWORD:DRAGON}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_EXPERIENCE_HOST:localhost}:${DB_EXPERIENCE_PORT:5432}/${DB_EXPERIENCE_NAME:ec_experience}
# Reactive URL for Panache
quarkus.datasource.reactive.url=postgresql://${DB_EXPERIENCE_HOST:localhost}:${DB_EXPERIENCE_PORT:5432}/${DB_EXPERIENCE_NAME:ec_experience}

# Flyway per-service migration (owner of ecommerce_content)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=public
quarkus.flyway.default-schema=public

# Hibernate ORM schema ownership
quarkus.hibernate-orm.database.default-schema=public

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Test: Flyway off, drop-and-create in public schema
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.default-schema=public


# Redis standalone config
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://:dragon_knight@localhost:6379}
quarkus.flyway.baseline-on-migrate=true
