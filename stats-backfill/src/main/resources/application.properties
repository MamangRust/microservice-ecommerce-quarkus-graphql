# Stats Backfill — one-shot job to migrate historical OLTP data to ClickHouse
quarkus.application.name=stats-backfill

# Disable HTTP server (one-shot runner)
quarkus.http.port=-1

# PostgreSQL OLTP (for reading historical data)
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

# ClickHouse
clickhouse.host=${CLICKHOUSE_HOST:localhost}
clickhouse.http-port=${CLICKHOUSE_PORT:8123}
clickhouse.database=ecommerce_stats
clickhouse.username=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:none}

# Backfill config
backfill.domains=${BACKFILL_DOMAINS:order,transaction}
backfill.from-date=${BACKFILL_FROM:2024-01-01}

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG
