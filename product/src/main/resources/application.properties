quarkus.application.name=product-service

quarkus.grpc.server.port=9015
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8095
quarkus.http.host=0.0.0.0

# Datasource (JDBC for Flyway + reactive for Panache)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

# Flyway per-service migration (owner of ecommerce_catalog)
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=ecommerce_catalog
quarkus.flyway.default-schema=ecommerce_catalog

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.database.default-schema=ecommerce_catalog
quarkus.hibernate-orm.log.sql=false

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# Test: Flyway off, drop-and-create in public
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.default-schema=public

# Kafka reliability (for outbox publisher)
kafka.bootstrap.servers=${KAFKA_BROKERS:localhost:9092}
kafka.acks=${KAFKA_ACKS:all}
kafka.enable.idempotence=${KAFKA_ENABLE_IDEMPOTENCE:true}
kafka.retries=${KAFKA_RETRIES:10}
kafka.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:500}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:120000}
kafka.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:30000}
kafka.compression.type=${KAFKA_COMPRESSION_TYPE:lz4}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.batch.size=${KAFKA_BATCH_SIZE:16384}

# --- Performance tuning baseline (Phase 7) ---
# Conservative starting point; re-tune after load-test measurements.
quarkus.vertx.worker-pool-size=${VERTX_WORKER_POOL_SIZE:20}
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX_THREADS:32}
quarkus.redis.max-pool-size=${REDIS_MAX_POOL_SIZE:16}
quarkus.redis.max-pool-waiting=${REDIS_MAX_POOL_WAITING:32}
quarkus.redis.timeout=${REDIS_TIMEOUT:2S}



# Redis standalone config
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://:dragon_knight@localhost:6379}
